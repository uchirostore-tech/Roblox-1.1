<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Roblox Pulse V1.1 - Auto Session Connector</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <style>
    body {
      background: #08090C;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #111319;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 40px 48px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
      position: relative;
      overflow: hidden;
    }
    .logo-container {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px auto;
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0, 242, 254, 0.2);
    }
    .logo-container img {
      width: 48px;
      height: 48px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(0, 242, 254, 0.2);
      border-top-color: #00F2FE;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { 
      margin: 0 0 8px 0; 
      font-size: 22px; 
      font-weight: 800; 
      letter-spacing: -0.5px;
    }
    .brand-accent {
      color: #00F2FE;
    }
    p { 
      color: #94A3B8; 
      font-size: 13px; 
      margin: 0 0 20px 0; 
      line-height: 1.6; 
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #00F2FE 0%, #4FACFE 100%);
      color: #08090C;
      padding: 13px 28px;
      border-radius: 14px;
      font-weight: 800;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.2s;
      box-shadow: 0 8px 20px rgba(0, 242, 254, 0.25);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 242, 254, 0.4);
    }
    .attribution {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      color: #64748B;
    }
    .attribution a {
      color: #00F2FE;
      text-decoration: none;
      font-weight: bold;
    }
    .attribution a:hover {
      text-decoration: underline;
    }
    .channel-link {
      color: #10B981 !important;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <img src="icons/icon.svg" alt="Roblox Pulse Logo">
    </div>

    <h2>ROBLOX <span class="brand-accent">PULSE</span> V1.1</h2>
    <p>Detecting your active Roblox browser session and loading complete analysis...</p>
    
    <div class="spinner"></div>

    <div style="margin-top: 10px;">
      <a href="http://localhost:3001/?auto=true" id="btn-launch" class="btn">⚡ Open Dashboard</a>
    </div>

    <div class="attribution">
      Make by <a href="https://t.me/noreakyout" target="_blank">@noreakyout</a> • 
      Channel: <a href="https://t.me/uchirostore" class="channel-link" target="_blank">@uchirostore</a>
    </div>
  </div>

  <script>
    // Auto-detect if user has configured custom host in storage
    chrome.storage?.local?.get(['customHost'], (res) => {
      const targetHost = res?.customHost || "http://localhost:3001";
      const targetUrl = targetHost + "/?auto=true";
      const btn = document.getElementById('btn-launch');
      if (btn) btn.href = targetUrl;

      setTimeout(() => {
        window.location.href = targetUrl;
      }, 700);
    });
  </script>
</body>
</html>
